name: Keep Supabase Alive

on:
  schedule:
    # cron 表达式：每 3 天的 UTC 0:00 运行一次
    - cron: '0 0 */3 * *'
  # 允许在 GitHub 界面上手动点击触发运行
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X GET "${{ secrets.SUPABASE_URL_5 }}/rest/v1/students?select=*&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_5 }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY_5 }}"
